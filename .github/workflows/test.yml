name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASRA_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No env files or passwords
        run: bash .github/scripts/check-no-secrets.sh
      - name: Install test dependencies
        run: |
          pip install psycopg2-binary
          command -v psql || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
      - name: Server and admin tests
        run: python -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck deploy/*.sh deploy/postgres/*.sh deploy/asra deploy/asra-admin deploy/asra-deploy .github/scripts/*.sh
      - name: Docker images (the web image validates its Caddyfile while building)
        run: |
          sudo mkdir -p /etc/asra && sudo touch /etc/asra/asra.env
          docker compose build
